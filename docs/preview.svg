<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The Sidebar menu settings section: a default-panel group with show switches and one locked row, above a group of custom shortcut entries">
  <defs>
    <linearGradient id="dsm-preview-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa4c8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8aa4c8" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Settings dialog -->
  <rect x="28" y="24" width="584" height="252" rx="14" fill="url(#dsm-preview-panel)" stroke="#8aa4c8" stroke-opacity="0.45"/>

  <!-- Nav rail -->
  <rect x="40" y="36" width="140" height="228" rx="10" fill="#8aa4c8" fill-opacity="0.10"/>
  <rect x="52" y="48" width="50" height="8" rx="4" fill="#5b8def" fill-opacity="0.55"/>
  <g fill="#8aa4c8" fill-opacity="0.75">
    <rect x="52" y="72" width="58" height="8" rx="4"/>
    <rect x="52" y="94" width="44" height="8" rx="4"/>
  </g>
  <rect x="44" y="112" width="132" height="24" rx="8" fill="#5b8def" fill-opacity="0.18"/>
  <rect x="52" y="120" width="72" height="8" rx="4" fill="#3b6fd4"/>
  <g fill="#8aa4c8" fill-opacity="0.75">
    <rect x="52" y="148" width="64" height="8" rx="4"/>
    <rect x="52" y="170" width="52" height="8" rx="4"/>
  </g>

  <!-- Content heading -->
  <rect x="200" y="44" width="92" height="11" rx="5.5" fill="#3b6fd4" fill-opacity="0.85"/>
  <rect x="200" y="63" width="196" height="6" rx="3" fill="#8aa4c8" fill-opacity="0.75"/>

  <!-- Group 1: default sidebar panels -->
  <rect x="200" y="82" width="96" height="7" rx="3.5" fill="#5b8def" fill-opacity="0.85"/>
  <rect x="200" y="95" width="150" height="5" rx="2.5" fill="#8aa4c8" fill-opacity="0.7"/>

  <!-- row 1: fixed, locked switch -->
  <rect x="200" y="108" width="380" height="1" fill="#8aa4c8" fill-opacity="0.3"/>
  <rect x="206" y="116" width="12" height="12" rx="3" fill="#4f8ef7" fill-opacity="0.8"/>
  <rect x="226" y="116" width="62" height="7" rx="3.5" fill="#3b6fd4" fill-opacity="0.75"/>
  <rect x="292" y="115" width="44" height="10" rx="5" fill="#8aa4c8" fill-opacity="0.35"/>
  <rect x="536" y="114" width="34" height="12" rx="6" fill="#3b6fd4" fill-opacity="0.55"/>
  <circle cx="563" cy="120" r="4.6" fill="#ffffff"/>

  <!-- row 2: folded into More -->
  <rect x="200" y="136" width="380" height="1" fill="#8aa4c8" fill-opacity="0.3"/>
  <rect x="206" y="144" width="12" height="12" rx="3" fill="#4f8ef7" fill-opacity="0.6"/>
  <rect x="226" y="144" width="70" height="7" rx="3.5" fill="#4f8ef7" fill-opacity="0.55"/>
  <rect x="536" y="142" width="34" height="12" rx="6" fill="#8aa4c8" fill-opacity="0.55"/>
  <circle cx="543" cy="148" r="4.6" fill="#ffffff"/>

  <!-- row 3: shown -->
  <rect x="200" y="164" width="380" height="1" fill="#8aa4c8" fill-opacity="0.3"/>
  <rect x="206" y="172" width="12" height="12" rx="3" fill="#4f8ef7" fill-opacity="0.8"/>
  <rect x="226" y="172" width="56" height="7" rx="3.5" fill="#3b6fd4" fill-opacity="0.7"/>
  <rect x="536" y="170" width="34" height="12" rx="6" fill="#3b6fd4"/>
  <circle cx="563" cy="176" r="4.6" fill="#ffffff"/>

  <!-- Group 2: custom shortcut entries -->
  <rect x="200" y="194" width="82" height="7" rx="3.5" fill="#5b8def" fill-opacity="0.85"/>
  <rect x="200" y="210" width="380" height="1" fill="#8aa4c8" fill-opacity="0.3"/>
  <g stroke="#8aa4c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M206 218l4-3.5 4 3.5"/>
    <path d="M206 226l4 3.5 4-3.5"/>
  </g>
  <rect x="224" y="216" width="12" height="12" rx="3" fill="#4f8ef7" fill-opacity="0.8"/>
  <rect x="244" y="216" width="74" height="7" rx="3.5" fill="#3b6fd4" fill-opacity="0.7"/>
  <rect x="244" y="228" width="50" height="5" rx="2.5" fill="#8aa4c8" fill-opacity="0.7"/>
  <rect x="486" y="217" width="26" height="10" rx="5" fill="none" stroke="#8aa4c8" stroke-opacity="0.8"/>
  <rect x="520" y="216" width="24" height="12" rx="5" fill="none" stroke="#8aa4c8" stroke-opacity="0.8"/>
  <rect x="200" y="244" width="380" height="1" fill="#8aa4c8" stroke-opacity="0.3"/>

  <!-- Footer hint -->
  <rect x="200" y="256" width="228" height="5" rx="2.5" fill="#8aa4c8" fill-opacity="0.55"/>
</svg>
